<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <p>
            <label for="inum">Numero:</label>
            <input type="range" name="Numero" id="inum" min="0" max="10" value="5" 
            oninput="ivum.innerHTML = Number(inum.value)">
            <output id="ivum">5</output>
        </p>
    </form>
</body>
</html>
