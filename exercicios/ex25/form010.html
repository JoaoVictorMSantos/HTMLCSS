<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <p>
            <label for="inao">Ano que nasceu?</label>
            <input type="number" name="Ano" id="iano" min="1900" max="2020"
            oninput="calcIdade()">
        </p>
        <p>
            <label for="idade" >Idade è:</label>
            <output id="idade">0</output>
        </p>
    </form>
    <script>
        function calcIdade(){
            let atual = new Date().getFullYear()
            idade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
