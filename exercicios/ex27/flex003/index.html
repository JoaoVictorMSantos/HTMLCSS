<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container{
            background-color: lightcoral;

            display: flex;
            flex-flow: row wrap;
        }
        .item{
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
           
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A Exemplo de bloco </div>
        <div class="item">B Exemplo de bloco</div>
        <div class="item">C Exemplo de bloco</div>
        <div class="item">D Exemplo de bloco</div>
        <div class="item">F Exemplo de bloco</div>
        <div class="item">G Exemplo de bloco</div>
    </div>
</body>
</html>
